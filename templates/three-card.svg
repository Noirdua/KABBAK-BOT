<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980"
  viewBox="0 0 1600 980"
  data-kabbak-template="spread-print"
  data-id="three-card"
  data-name="Parchment three">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efe2c6"/>
      <stop offset="100%" stop-color="#e0cdb0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="980" fill="url(#page)"/>
  <rect x="28" y="28" width="1544" height="924" fill="none" stroke="#7a4e2a" stroke-width="2"/>
  <rect x="38" y="38" width="1524" height="904" fill="none" stroke="#7a4e2a" stroke-width="0.7" opacity="0.7"/>
  <path d="M60,96 H1540" fill="none" stroke="#7a4e2a" stroke-width="0.6" opacity="0.5"/>
  <text x="800" y="64" text-anchor="middle" fill="#7a4e2a" font-size="12" font-family="Georgia, serif" letter-spacing="6">K A B B A K</text>
  <text data-kabbak="title" x="800" y="130" text-anchor="middle" fill="#2a1b12" font-size="36" font-family="Georgia, serif" letter-spacing="0">Three Card</text>

  <rect x="118" y="188" width="256" height="436" rx="8" fill="#f7edd8" stroke="#7a4e2a" stroke-width="1.4"/>
  <rect x="672" y="188" width="256" height="436" rx="8" fill="#f7edd8" stroke="#7a4e2a" stroke-width="1.4"/>
  <rect x="1226" y="188" width="256" height="436" rx="8" fill="#f7edd8" stroke="#7a4e2a" stroke-width="1.4"/>

  <image data-kabbak="card" data-index="1" data-pos="past" x="126" y="196" width="240" height="420" preserveAspectRatio="xMidYMid slice"/>
  <image data-kabbak="card" data-index="2" data-pos="present" x="680" y="196" width="240" height="420" preserveAspectRatio="xMidYMid slice"/>
  <image data-kabbak="card" data-index="3" data-pos="future" x="1234" y="196" width="240" height="420" preserveAspectRatio="xMidYMid slice"/>

  <text data-kabbak="label" data-index="1" data-pos="past" x="246" y="650" text-anchor="middle" fill="#7a4e2a" font-size="13"
    font-family="Georgia, serif" letter-spacing="3">PAST</text>
  <text data-kabbak="label" data-index="2" data-pos="present" x="800" y="650" text-anchor="middle" fill="#7a4e2a" font-size="13"
    font-family="Georgia, serif" letter-spacing="3">PRESENT</text>
  <text data-kabbak="label" data-index="3" data-pos="future" x="1354" y="650" text-anchor="middle" fill="#7a4e2a" font-size="13"
    font-family="Georgia, serif" letter-spacing="3">FUTURE</text>

  <text data-kabbak="name" data-index="1" data-pos="past" x="246" y="672" text-anchor="middle" fill="#2a1b12" font-size="16"
    font-family="Georgia, serif">Card</text>
  <text data-kabbak="name" data-index="2" data-pos="present" x="800" y="672" text-anchor="middle" fill="#2a1b12" font-size="16"
    font-family="Georgia, serif">Card</text>
  <text data-kabbak="name" data-index="3" data-pos="future" x="1354" y="672" text-anchor="middle" fill="#2a1b12" font-size="16"
    font-family="Georgia, serif">Card</text>

  <g data-kabbak="reversed" data-index="1" data-pos="past" display="none">
    <text x="246" y="690" text-anchor="middle" fill="#7a4e2a" font-size="11" font-family="Georgia, serif">REVERSED</text>
  </g>
  <g data-kabbak="reversed" data-index="2" data-pos="present" display="none">
    <text x="800" y="690" text-anchor="middle" fill="#7a4e2a" font-size="11" font-family="Georgia, serif">REVERSED</text>
  </g>
  <g data-kabbak="reversed" data-index="3" data-pos="future" display="none">
    <text x="1354" y="690" text-anchor="middle" fill="#7a4e2a" font-size="11" font-family="Georgia, serif">REVERSED</text>
  </g>

  <text data-kabbak="meaning" data-index="1" data-pos="past" data-width="240" x="126" y="716" fill="#3d2a1c" font-size="13"
    font-family="Georgia, serif">Meaning</text>
  <text data-kabbak="meaning" data-index="2" data-pos="present" data-width="240" x="680" y="716" fill="#3d2a1c" font-size="13"
    font-family="Georgia, serif">Meaning</text>
  <text data-kabbak="meaning" data-index="3" data-pos="future" data-width="240" x="1234" y="716" fill="#3d2a1c" font-size="13"
    font-family="Georgia, serif">Meaning</text>

  <text data-kabbak="footer" x="800" y="940" text-anchor="middle" fill="#7a4e2a" font-size="12"
    font-family="Georgia, serif" letter-spacing="1">Deck</text>
</svg>
